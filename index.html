<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Ashley!</title>
  <link rel="stylesheet" href="../css/index.css" />
  <link rel="stylesheet" href="../css/global.css" />
  <link rel="icon" type="image/png" href="./Assets/Icons/favicon.png" />
</head>

<body>
  <section class="greeting-landing">
    <div class="floating-heart heart-one">❤</div>
    <div class="floating-heart heart-two">❤</div>
    <div class="floating-heart heart-three">❤</div>

    <div class="greeting-container">
      <div class="letter-content">
        <p class="small-text">You received something special</p>

        <h1 class="greeting-title inspiration-regular">
          Happy Birthday!
        </h1>

        <div class="envelope-wrap">
          <img
            src="../Assets/img/Global/pink-envelope.png"
            alt="Invitation Image"
            class="invitation-mail"
          />

          <button
            class="link-button"
            onclick="window.location.href='./pages/happy-birthday.html'"
            aria-label="Open birthday letter"
          >
            <span></span>
          </button>
        </div>

        <p class="invitation-label">Click the seal to open</p>
      </div>
    </div>
  </section>
</body>
</html>
