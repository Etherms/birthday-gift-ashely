<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Relationship Quiz</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  font-family: "Poppins", Arial, sans-serif;
  background: linear-gradient(135deg, #ffe1ec, #fff7fb);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  color: #5a2a3a;
}

.quiz-page {
  width: 100%;
  max-width: 430px;
  background: rgba(255, 255, 255, 0.9);
  border-radius: 28px;
  padding: 28px 22px;
  box-shadow: 0 20px 45px rgba(255, 105, 150, 0.25);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.quiz-page::before,
.quiz-page::after {
  content: "♡";
  position: absolute;
  font-size: 80px;
  color: rgba(255, 137, 177, 0.18);
}

.quiz-page::before {
  top: -20px;
  left: -10px;
}

.quiz-page::after {
  bottom: -30px;
  right: -5px;
}

.quiz-title {
  font-size: 30px;
  margin-bottom: 8px;
  color: #ff5f99;
}

.quiz-subtitle {
  font-size: 14px;
  margin-bottom: 28px;
  opacity: 0.8;
}

.question-box {
  position: relative;
  z-index: 2;
}

.question-count {
  font-size: 13px;
  margin-bottom: 10px;
  color: #ff7cab;
  font-weight: 600;
}

.question {
  font-size: 22px;
  line-height: 1.3;
  margin-bottom: 22px;
}

.answers {
  display: grid;
  gap: 12px;
}

.answer-btn {
  border: none;
  background: #fff0f6;
  color: #6b2e42;
  padding: 14px 16px;
  border-radius: 18px;
  font-size: 15px;
  cursor: pointer;
  transition: 0.25s ease;
  border: 2px solid transparent;
}

.answer-btn:hover {
  transform: translateY(-2px);
  background: #ffe1ee;
}

.answer-btn.correct {
  background: #dff8ea;
  border-color: #72d99b;
}

.answer-btn.wrong {
  background: #ffe0e0;
  border-color: #ff8585;
}

.message {
  min-height: 26px;
  margin: 18px 0;
  font-size: 15px;
  font-weight: 600;
}

.next-btn,
.restart-btn {
  display: none;
  width: 100%;
  border: none;
  background: #ff6fa8;
  color: white;
  padding: 14px;
  border-radius: 18px;
  font-size: 16px;
  cursor: pointer;
  box-shadow: 0 8px 18px rgba(255, 111, 168, 0.35);
}

.next-btn.show,
.restart-btn.show {
  display: block;
}

.result-box {
  display: none;
  position: relative;
  z-index: 2;
}

.result-box.show {
  display: block;
}

.result-title {
  font-size: 28px;
  color: #ff5f99;
  margin-bottom: 12px;
}

.result-score {
  font-size: 20px;
  margin-bottom: 16px;
}

.result-message {
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 24px;
}

.floating-heart {
  position: fixed;
  bottom: -20px;
  color: #ff80ad;
  animation: floatHeart 6s linear infinite;
  opacity: 0.7;
  pointer-events: none;
}

@keyframes floatHeart {
  0% {
    transform: translateY(0) scale(0.8);
    opacity: 0;
  }
  20% {
    opacity: 0.8;
  }
  100% {
    transform: translateY(-110vh) scale(1.4);
    opacity: 0;
  }
}

@media (max-width: 480px) {
  .quiz-page {
    padding: 26px 18px;
  }

  .quiz-title {
    font-size: 27px;
  }

  .question {
    font-size: 20px;
  }
}
</style>
</head>

<body>

<div class="quiz-page">
  <div id="quizBox" class="question-box">
    <h1 class="quiz-title">Relationship Quiz ♡</h1>
    <p class="quiz-subtitle">Let’s see how well you know us</p>

    <p class="question-count" id="questionCount"></p>
    <h2 class="question" id="questionText"></h2>

    <div class="answers" id="answers"></div>

    <p class="message" id="message"></p>

    <button class="next-btn" id="nextBtn">Next Question</button>
  </div>

  <div id="resultBox" class="result-box">
    <h2 class="result-title">Quiz Finished ♡</h2>
    <p class="result-score" id="resultScore"></p>
    <p class="result-message" id="resultMessage"></p>
    <button class="restart-btn show" onclick="restartQuiz()">Play Again</button>
  </div>
</div>

<script>
const quizData = [
  {
    question: "Who confessed first?",
    answers: ["Me", "You", "Both of us", "No one, it just happened"],
    correct: "Me"
  },
  {
    question: "What’s my favorite thing about you?",
    answers: ["Your smile", "Your laugh", "Your kindness", "Everything about you"],
    correct: "Everything about you"
  },
  {
    question: "Where was our first picture together?",
    answers: ["At school", "At the mall", "At home", "Somewhere special"],
    correct: "Somewhere special"
  },
  {
    question: "What do I love doing with you?",
    answers: ["Talking for hours", "Eating together", "Taking pictures", "All of these"],
    correct: "All of these"
  },
  {
    question: "How much do I love you?",
    answers: ["A little", "A lot", "Too much", "More than words can say"],
    correct: "More than words can say"
  }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

const questionCount = document.getElementById("questionCount");
const questionText = document.getElementById("questionText");
const answersBox = document.getElementById("answers");
const message = document.getElementById("message");
const nextBtn = document.getElementById("nextBtn");
const quizBox = document.getElementById("quizBox");
const resultBox = document.getElementById("resultBox");
const resultScore = document.getElementById("resultScore");
const resultMessage = document.getElementById("resultMessage");

function loadQuestion() {
  answered = false;
  message.textContent = "";
  nextBtn.classList.remove("show");

  const current = quizData[currentQuestion];

  questionCount.textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
  questionText.textContent = current.question;
  answersBox.innerHTML = "";

  current.answers.forEach(answer => {
    const button = document.createElement("button");
    button.className = "answer-btn";
    button.textContent = answer;

    button.addEventListener("click", () => checkAnswer(button, answer));
    answersBox.appendChild(button);
  });
}

function checkAnswer(button, selectedAnswer) {
  if (answered) return;

  answered = true;
  const correctAnswer = quizData[currentQuestion].correct;
  const allButtons = document.querySelectorAll(".answer-btn");

  allButtons.forEach(btn => {
    if (btn.textContent === correctAnswer) {
      btn.classList.add("correct");
    }
  });

  if (selectedAnswer === correctAnswer) {
    score++;
    button.classList.add("correct");
    message.textContent = "Correct! You know us so well ♡";
  } else {
    button.classList.add("wrong");
    message.textContent = "Oops, but you’re still cute ♡";
  }

  nextBtn.classList.add("show");
}

nextBtn.addEventListener("click", () => {
  currentQuestion++;

  if (currentQuestion < quizData.length) {
    loadQuestion();
  } else {
    showResult();
  }
});

function showResult() {
  quizBox.style.display = "none";
  resultBox.classList.add("show");

  resultScore.textContent = `You got ${score} out of ${quizData.length}!`;

  if (score === quizData.length) {
    resultMessage.textContent = "Perfect score! You really know our story. I love you so much ♡";
  } else if (score >= 3) {
    resultMessage.textContent = "You did great! Some answers were tricky, but my favorite answer will always be you ♡";
  } else {
    resultMessage.textContent = "It’s okay, we still have many memories to make together ♡";
  }
}

function restartQuiz() {
  currentQuestion = 0;
  score = 0;
  quizBox.style.display = "block";
  resultBox.classList.remove("show");
  loadQuestion();
}

function createHeart() {
  const heart = document.createElement("div");
  heart.className = "floating-heart";
  heart.textContent = "♡";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 18 + 16 + "px";
  heart.style.animationDuration = Math.random() * 3 + 4 + "s";

  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 7000);
}

setInterval(createHeart, 700);

loadQuestion();
</script>

</body>
</html>
